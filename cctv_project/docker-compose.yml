services:
  db:
    image: postgres:15-alpine
    container_name: cctv_db
    restart: always
    environment:
      POSTGRES_DB: cctv_db
      POSTGRES_USER: cctv_user
      POSTGRES_PASSWORD: cctv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cctv_user -d cctv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: cctv_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cctv_user:cctv_password@db:5432/cctv_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
    container_name: cctv_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: